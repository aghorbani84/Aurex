# No advisory exceptions. New findings must fail visibly; do not blanket-ignore them.
[advisories]
ignore = []
yanked = "deny"
unmaintained = "all"

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0",
  "CC0-1.0", "Unlicense", "MPL-2.0", "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
