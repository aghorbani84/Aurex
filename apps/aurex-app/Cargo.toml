[package]
name = "aurex-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

# Separate renderer workspace keeps the audited core build independent of native WebView packages.
[workspace]
resolver = "3"

[dependencies]
aurex-core = { path = "../../crates/aurex-core", version = "=0.1.0" }
aurex-fs = { path = "../../crates/aurex-fs", version = "=0.1.0" }
aurex-tasks = { path = "../../crates/aurex-tasks", version = "=0.1.0" }
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "desktop"] }
tokio = { version = "=1.48.0", features = ["time"] }
