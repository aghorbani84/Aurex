name: Engineering candidate artifacts (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli-candidate:
    name: Validated Linux CLI candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust with native rustup
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: python scripts/package.py
      - name: Upload validated unsigned CLI only (not a GUI release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurex-cli-linux-x86_64-${{ github.sha }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
# Build-only; no publication, signing, deployment or release permissions.
