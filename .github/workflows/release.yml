name: Engineering candidate artifacts (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli-candidate:
    name: Validated Linux CLI candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust with native rustup
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: python scripts/package.py
      - name: Upload validated unsigned CLI only (not a GUI release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurex-cli-linux-x86_64-${{ github.sha }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
# Build-only; no publication, signing, deployment or release permissions.
