name: Android native engineering APKs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    env:
      ANDROID_NDK_VERSION: '28.1.13356709'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned Rust and requested Android standard library
        env:
          ANDROID_TARGET: ${{ matrix.target }}
        run: rustup toolchain install 1.88.0 --profile minimal --target "$ANDROID_TARGET"
      - name: Configure JDK 17, Android API 35 and pinned NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          python -c 'import os,subprocess; subprocess.run([os.environ["ANDROID_HOME"]+"/cmdline-tools/latest/bin/sdkmanager","--licenses"],input="y\n"*100,text=True,check=True)'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install checksum-verified official Dioxus CLI 0.7.10
        run: |
          python scripts/install_dx.py --output "$RUNNER_TEMP/aurex-dx"
          echo "$RUNNER_TEMP/aurex-dx" >> "$GITHUB_PATH"
      - name: Compile native app and verify real debug APK architecture/signature/permissions
        env:
          ANDROID_TARGET: ${{ matrix.target }}
        run: python scripts/build_android.py --target "$ANDROID_TARGET"
      - name: Upload actual APK and provenance, or failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurex-android-${{ matrix.target }}-debug-${{ github.sha }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14
