name: Android packaging readiness (blocked)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    name: Android blockers and readiness report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Fail closed until actual mobile entrypoint and SAF exist
        run: python scripts/platform_gate.py
      - name: Upload diagnostic report, never an imaginary APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-readiness-${{ github.sha }}
          path: artifacts/android/readiness.json
          if-no-files-found: error
          retention-days: 14
