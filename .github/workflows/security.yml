name: Security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-and-secrets:
    name: Workflow policy and secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.5'
          cache: false
      - name: Install pinned official-source tools
        run: |
          python -m pip install zizmor==1.31.1 PyYAML==6.0.3
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: python scripts/validate_workflows.py
      - run: actionlint
      - run: zizmor --offline --persona auditor .github/workflows
      - name: Scan history with redacted output
        run: gitleaks git --redact --report-format json --report-path artifacts-gitleaks.json
  dependencies:
    name: Cargo advisories and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust with native rustup
        run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Run all dependency graphs without fail-fast or ignored errors
        id: audit
        run: python3 scripts/audit_dependencies.py
      - name: Upload diagnostic results, including failures
        if: always() && steps.audit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-security-${{ github.sha }}
          path: artifacts/security/dependencies.json
          if-no-files-found: error
          retention-days: 14
