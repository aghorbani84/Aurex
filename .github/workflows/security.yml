name: Security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-and-secrets:
    name: Workflow policy and secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Install pinned official-source tools
        run: |
          python -m pip install zizmor==1.31.1 PyYAML==6.0.3
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: python scripts/validate_workflows.py
      - run: actionlint
      - run: zizmor --offline --persona auditor .github/workflows
      - name: Scan history with redacted output
        run: gitleaks git --redact --report-format json --report-path artifacts-gitleaks.json
  dependencies:
    name: Cargo advisories and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust with native rustup
        run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo install cargo-audit --version 0.21.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit --file Cargo.lock
      - run: cargo audit --file apps/aurex-app/Cargo.lock
      - run: cargo deny --manifest-path Cargo.toml check advisories licenses bans sources
      - run: cargo deny --manifest-path apps/aurex-app/Cargo.toml check advisories licenses bans sources
