name: Linux build and CLI candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli-candidate:
    name: Validated Linux CLI candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust with native rustup
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: python scripts/package.py
      - name: Upload validated unsigned CLI only (not a GUI release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurex-cli-linux-x86_64-${{ github.sha }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
  desktop-build:
    name: Native desktop build (runtime not accepted)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust with native rustup
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/aurex-app/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-desktop-${{ hashFiles('apps/aurex-app/Cargo.lock') }}
      - name: Native dependencies from Ubuntu package repositories
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libglib2.0-dev libssl-dev libasound2-dev libudev-dev nasm
      - run: cargo build --manifest-path apps/aurex-app/Cargo.toml --release --locked
      # No GUI binary is distributed until display/runtime acceptance exists.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/aurex-app/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-desktop-${{ hashFiles('apps/aurex-app/Cargo.lock') }}
