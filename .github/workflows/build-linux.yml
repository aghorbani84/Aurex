name: Linux build and CLI candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli-candidate:
    name: Validated Linux CLI candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust with native rustup
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: python scripts/package.py
      - name: Upload validated unsigned CLI only (not a GUI release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurex-cli-linux-x86_64-${{ github.sha }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
  desktop-build:
    name: Native desktop build (runtime not accepted)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust with native rustup
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/aurex-app/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-desktop-${{ hashFiles('apps/aurex-app/Cargo.lock') }}
      - name: Native dependencies from Ubuntu package repositories
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libglib2.0-dev libssl-dev libasound2-dev libudev-dev nasm
      - run: cargo build --manifest-path apps/aurex-app/Cargo.toml --release --locked
      # No GUI binary is distributed until display/runtime acceptance exists.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/aurex-app/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-desktop-${{ hashFiles('apps/aurex-app/Cargo.lock') }}
