name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust with native rustup
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-core-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path apps/aurex-app/Cargo.toml --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: python -m unittest discover -s tests -v
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-core-${{ hashFiles('Cargo.lock') }}
